<title>Εξετάσεις χειριστή γεωργικών μηχανημάτων</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Literata:opsz,wght@7..72,600;7..72,700;7..72,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2efe3;--bg2:#e7e9d6;--card:#fffdf6;--ink:#20261a;--muted:#6d7362;
  --accent:#2e6b34;--accent-hi:#255c2b;--accent-deep:#1b4521;--soft:#e6efe2;
  --gold:#e3b04b;--ok:#1c7a33;--ok-bg:#e2f2e5;--bad:#b3261e;--bad-bg:#fbe9e7;
  --line:#ddd8c2;--opt:#faf8ee;--track:#e3decb;--ring-rest:#e6e1cd;--r:16px;
  --shadow:0 1px 2px rgba(32,38,26,.05),0 10px 26px -20px rgba(32,38,26,.4);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#161a12;--bg2:#1c2216;--card:#20261a;--ink:#e9ebdf;--muted:#9ba38b;
    --accent:#5a9e61;--accent-hi:#6bae72;--accent-deep:#183f1e;--soft:#28331f;
    --gold:#d9a441;--ok:#63b96f;--ok-bg:#1e3324;--bad:#e07068;--bad-bg:#3a201d;
    --line:#343b29;--opt:#242b1d;--track:#2b3222;--ring-rest:#2e3523;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -18px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(130% 55% at 50% -5%,var(--bg2),rgba(0,0,0,0) 60%),var(--bg);
  color:var(--ink);
  font:16px/1.5 'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 64px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.enter{animation:rise .28s ease both}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#377e3e 0%,var(--accent-deep) 90%);
  color:#fff;border-radius:20px;padding:26px 22px 108px;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:0;z-index:0;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,rgba(255,255,255,0) 2px 16px)}
.hero>*{position:relative;z-index:1}
.hero .scene{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.kicker{font-size:13px;color:var(--gold);font-weight:800;letter-spacing:.04em}
h1{font-family:'Literata',Georgia,serif;font-size:31px;line-height:1.16;margin:8px 0;letter-spacing:-.01em;font-weight:800;color:#fff}
.hero .sub{color:#d9e5d4;font-size:14.5px;margin:0;max-width:270px}
.menu{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.card{display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;cursor:pointer;font:inherit;color:inherit;box-shadow:var(--shadow);
  transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.icon{flex:0 0 44px;height:44px;border-radius:12px;background:var(--soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center}
.icon svg{width:22px;height:22px}
.card-body{flex:1;display:flex;flex-direction:column;gap:2px}
.card-title{font-weight:700;font-size:17.5px}
.card-sub{color:var(--muted);font-size:14px;line-height:1.4}
.chev{color:var(--muted);font-size:24px;line-height:1;flex:0 0 auto}
.stats{display:flex;gap:10px;margin-top:14px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-family:'Literata',Georgia,serif;font-size:22px;font-weight:800;
  font-variant-numeric:tabular-nums;line-height:1.15}
.stat span{font-size:12.5px;color:var(--muted);font-weight:600}
.stat.warn b{color:var(--bad)}
.reset{display:block;margin:16px auto 0;background:none;border:none;color:var(--muted);
  font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.reset:hover{color:var(--bad)}
.kbd-hint{margin-top:18px;text-align:center;font-size:12.5px;color:var(--muted)}
.kbd-hint kbd{display:inline-block;background:var(--card);border:1px solid var(--line);border-bottom-width:2px;
  border-radius:6px;padding:1px 7px;font:600 12px 'Inter',sans-serif;margin:0 1px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 12px}
.link{background:none;border:none;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;padding:6px 0}
.topttl{font-weight:700;font-size:14px;color:var(--muted)}
.tmr,.score{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;color:var(--muted);
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 11px;white-space:nowrap}
.prog{height:6px;background:var(--track);border-radius:3px;overflow:hidden;margin-bottom:16px}
.prog-in{height:100%;background:linear-gradient(90deg,var(--accent),#4d9254);border-radius:3px;transition:width .25s}
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;box-shadow:var(--shadow)}
.qmeta{display:flex;gap:6px;margin-bottom:4px}
.pill{display:inline-block;font-size:12.5px;font-weight:700;color:var(--accent);background:var(--soft);
  border-radius:999px;padding:3px 11px}
.pill.soft{color:var(--muted);background:var(--track)}
.qtext{font-family:'Literata',Georgia,serif;font-size:18.5px;font-weight:700;line-height:1.5;margin:12px 0 16px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;background:var(--opt);
  border:1px solid var(--line);border-radius:12px;padding:13px 12px;font:inherit;color:inherit;cursor:pointer;
  transition:border-color .12s,background .12s;width:100%}
.opt:not(.locked):hover{border-color:var(--accent);background:var(--soft)}
.opt.locked{cursor:default}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt.sel{background:var(--soft);border-color:var(--accent)}
.ltr{flex:0 0 28px;height:28px;border-radius:50%;background:var(--soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:800}
.opt.ok .ltr{background:var(--ok);color:#fff}
.opt.bad .ltr{background:var(--bad);color:#fff}
.opt.sel .ltr{background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){
  .opt.ok .ltr,.opt.bad .ltr,.opt.sel .ltr{color:#141810}
  .primary{color:#141810}
}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:700;font-size:15px;line-height:1.45}
.fb.ok-t{background:var(--ok-bg)}
.fb.bad-t{background:var(--bad-bg)}
.ok-t{color:var(--ok)}
.bad-t{color:var(--bad)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:16px}
.primary{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:14px 18px;
  font:inherit;font-weight:700;cursor:pointer;flex:1;box-shadow:0 8px 16px -10px rgba(46,107,52,.65);
  transition:background .15s,transform .1s}
.primary:hover{background:var(--accent-hi)}
.primary:active{transform:translateY(1px)}
.retry{margin-top:14px;width:100%}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;
  font:inherit;font-weight:600;color:var(--ink);cursor:pointer;flex:1}
.ghost:disabled{opacity:.4;cursor:default}
.setup{display:flex;flex-direction:column;gap:20px;margin-top:6px}
.lbl{font-size:14px;color:var(--muted);font-weight:700;margin-bottom:8px}
.seg{display:flex;flex-direction:column;gap:8px}
.seg button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;font:inherit;cursor:pointer;color:inherit;width:100%;transition:border-color .12s,background .12s}
.seg button:hover:not(:disabled){border-color:var(--accent)}
.seg button:disabled{opacity:.45;cursor:default}
.seg button.on{border-color:var(--accent);background:var(--soft);font-weight:700;box-shadow:inset 0 0 0 1px var(--accent)}
.seg.row{flex-direction:row;flex-wrap:wrap}
.seg.row button{flex:1;text-align:center;min-width:64px}
.hint{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}
.res{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px 16px 22px;
  text-align:center;box-shadow:var(--shadow)}
.ring{width:172px;height:172px;border-radius:50%;margin:4px auto 2px;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--ring-rest) 0);
  display:flex;align-items:center;justify-content:center}
.ring-in{width:138px;height:138px;border-radius:50%;background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.res-score{font-family:'Literata',Georgia,serif;font-size:34px;font-weight:800;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1.1}
.res-pct{color:var(--muted);font-weight:700;margin-top:2px}
.res-time{color:var(--muted);font-size:14px;margin-top:10px}
.res-note{color:var(--muted);font-size:13.5px;margin-top:8px}
.verdict{display:inline-block;margin-top:12px;padding:7px 18px;border-radius:999px;font-weight:800;font-size:15px}
.verdict.pass{background:var(--ok-bg);color:var(--ok)}
.verdict.fail{background:var(--bad-bg);color:var(--bad)}
.wrongs{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.witem{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--bad);
  border-radius:12px;padding:13px;text-align:left}
.wq{font-weight:700;margin-bottom:6px;font-size:15px;line-height:1.4}
.wa{font-size:14px;margin-top:3px;line-height:1.45}
.credit{max-width:640px;margin:0 auto;padding:0 16px 40px;text-align:center;
  font-size:12.5px;color:var(--muted);line-height:1.6}
.credit b{font-weight:700;color:var(--ink);opacity:.85}
.hero .by{margin-top:14px;font-size:12.5px;color:#c3d6bf;opacity:.95}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>

<footer class="credit">Δημιουργός: <b>Δρ. Κουκουβίνος Γεώργιος</b></footer>
<script>
// Τράπεζα ερωτήσεων. s: "A" = Ενότητα Α (μόνο πτυχίο Α, ερ. 1-40), "B" = Ενότητα Β (πτυχία Α και Β, ερ. 41-110).
// c: δείκτης σωστής απάντησης (0=Α, 1=Β, 2=Γ). Αν χρειαστεί διόρθωση στο κλειδί, αλλάζετε μόνο το c.
const QUESTIONS=[
{n:1,s:"A",q:"Ποια είναι η κυκλοφορία του νερού στο σύστημα ψύξης;",o:["Ψυγείο – άνω κολάρο – θερμοστάτης – υδροχιτώνια – υδραντλία – κάτω κολάρο – ψυγείο.","Ψυγείο – κάτω κολάρο – υδραντλία – υδροχιτώνια – θερμοστάτης – άνω κολάρο – ψυγείο."],c:1},
{n:2,s:"A",q:"Ποιος είναι ο σκοπός της αντλίας νερού;",o:["Να κυκλοφορεί το νερό μόνο μέσα στο ψυγείο.","Να υποχρεώνει το νερό να κυκλοφορεί από το ψυγείο προς τον κινητήρα."],c:1},
{n:3,s:"A",q:"Ποιο αποτέλεσμα μπορεί να έχει ένας θερμοστάτης κατεστραμμένος στη θέση του κλειστού;",o:["Να προκαλέσει επικίνδυνη άνοδο της θερμοκρασίας του κινητήρα.","Να προκαλέσει σπάσιμο του ψυγείου."],c:0},
{n:4,s:"A",q:"Εάν κατά τη πορεία του ελκυστήρα κοπεί το λουρί του ανεμιστήρα, ποιο όργανο θα δείξει πρώτο ότι κάτι συμβαίνει;",o:["Το θερμόμετρο.","Το αμπερόμετρο."],c:1},
{n:5,s:"A",q:"Ποιος είναι ο σκοπός του θερμοστάτη στο σύστημα ψύξεως;",o:["Να μην επιτρέπει την κυκλοφορία του νερού, πριν φθάσει στην κανονική του θερμοκρασία.","Να μας δείχνει τη θερμοκρασία του νερού."],c:0},
{n:6,s:"A",q:"Ποιος είναι ο σκοπός της γεννήτριας (δυναμό);",o:["Να παράγει ηλεκτρικό ρεύμα.","Να δίνει ρεύμα στην μίζα κατά την εκκίνηση."],c:0},
{n:7,s:"A",q:"Όταν η μπαταρία έχει έξι (6) καπάκια, τι μπαταρία είναι;",o:["Εξάβολτη 6V","Δωδεκάβολτη 12V"],c:1},
{n:8,s:"A",q:"Τι κάνουν οι αναφλεκτήρες (μπουζί);",o:["Δίνουν σπινθήρα για να καεί το καύσιμο στους πετρελαιοκινητήρες.","Δίνουν σπινθήρα για να καεί το καύσιμο στους βενζινοκινητήρες."],c:1},
{n:9,s:"A",q:"Τι θα συμβεί στις μπαταρίες όταν μένουν βουλωμένες οι τρύπες των καπακιών τους;",o:["Δεν θα συμβεί τίποτα.","Θα σπάσουν οι μπαταρίες."],c:1},
{n:10,s:"A",q:"Ποιος είναι ο σκοπός της μίζας;",o:["Να βάζει σε κίνηση τον κινητήρα.","Να παράγει ηλεκτρικό ρεύμα."],c:0},
{n:11,s:"A",q:"Αν χυθούν τα υγρά της μπαταρίας, τι πρέπει να κάνουμε;",o:["Θα τα αντικαταστήσουμε με αποσταγμένο νερό ή βρόχινο.","Θα πάμε την μπαταρία σε ηλεκτροτεχνίτη για να βάλει το κατάλληλο υγρό."],c:1},
{n:12,s:"A",q:"Γυρίζουμε τον διακόπτη για να βάλουμε σε κίνηση τον κινητήρα, αλλά η μίζα δεν γυρίζει. Ποιο από τα παρακάτω μπορεί να συμβαίνει;",o:["Δεν δουλεύει η γεννήτρια (δυναμό).","Δεν φθάνει ρεύμα στην μίζα."],c:1},
{n:13,s:"A",q:"Όταν κινούμαστε σε παγωμένο έδαφος ή σε δρόμο με αιχμηρές πέτρες, τι είναι προτιμότερο για τα λάστιχα, να έχουν μεγάλη πίεση ή μικρή;",o:["Να έχουν μεγάλη πίεση.","Να έχουν μικρή πίεση."],c:1},
{n:14,s:"A",q:"Εάν από την εξάτμιση του ελκυστήρα σας, κατά την εργασία, βγαίνει πολύς μαύρος καπνός, σε ποιον από τους παρακάτω λόγους μπορεί να οφείλεται αυτό;",o:["Σε κακή ρύθμιση της αντλίας πετρελαίου.","Σε βλάβη της εξάτμισης."],c:0},
{n:15,s:"A",q:"Η παρουσία νερού στο πετρέλαιο τι ανωμαλίες προκαλεί;",o:["Κάνει την μηχανή να σβήνει και σκουριάζει την αντλία πετρελαίου.","Καταστρέφει το φίλτρο πετρελαίου."],c:0},
{n:16,s:"A",q:"Ποια η διαδρομή του πετρελαίου από το ρεζερβουάρ μέχρι την καύση του;",o:["Δοχείο καυσίμου – βοηθητική αντλία – φίλτρα – αντλία υψηλής πιέσεως – ψεκαστές.","Δοχείο καυσίμου – αντλία – φίλτρο – ψεκαστές."],c:0},
{n:17,s:"A",q:"Ποιο όργανο ζημιώνεται πρώτα όταν δεν συντηρούμε το φίλτρο πετρελαίου;",o:["Η αντλία πετρελαίου.","Ο κινητήρας."],c:0},
{n:18,s:"A",q:"Με ποιο τρόπο αναφλέγεται το πετρέλαιο στον πετρελαιοκινητήρα του ελκυστήρα;",o:["Με ηλεκτρικό σπινθήρα.","Με τη μεγάλη θερμοκρασία που αναπτύσσεται από τη συμπίεση του αέρα."],c:1},
{n:19,s:"A",q:"Θέλουν συντήρηση και έλεγχο τα μπεκ;",o:["Θέλουν μόνο καθάρισμα.","Θέλουν καθάρισμα και έλεγχο της πιέσεως σε ειδικό συνεργείο κάθε 250–300 ώρες."],c:1},
{n:20,s:"A",q:"Όταν η τρύπα στο καπάκι του ρεζερβουάρ είναι βουλωμένη, τι από τα παρακάτω μπορεί να συμβεί;",o:["Να σβήσει ο κινητήρας.","Να ζεσταθεί ο κινητήρας."],c:0},
{n:21,s:"A",q:"Τα ελατήρια λαδιού των εμβόλων τι κάνουν;",o:["Λιπαίνουν τις βαλβίδες.","Λιπαίνουν τους κυλίνδρους της μηχανής."],c:1},
{n:22,s:"A",q:"Όταν υπάρχει η κανονική ποσότητα λαδιού στο κάρτερ, μπορεί να υπερθερμαίνεται ο κινητήρας από έλλειψη λαδιού;",o:["Μπορεί","Δεν μπορεί"],c:0},
{n:23,s:"A",q:"Πότε γρασάρεται καλύτερα ο ελκυστήρας;",o:["Όταν σε κάθε γρασαδοράκι κάνουμε πέντε εμβολισμούς.","Όταν κάνουμε τόσους εμβολισμούς, ώστε το γράσο να σκάσει."],c:1},
{n:24,s:"A",q:"Ποιος είναι ο σκοπός του φίλτρου λαδιού;",o:["Να κάνει ψιλότερο το λάδι.","Να συγκρατεί τα γρέζια και τις άλλες ακαθαρσίες του λαδιού."],c:1},
{n:25,s:"A",q:"Ένας τετράχρονος πετρελαιοκινητήρας (ντίζελ) κατά το χρόνο της εισαγωγής τι απορροφά;",o:["Μίγμα πετρελαίου αέρα.","Καθαρό αέρα.","Μόνο πετρέλαιο."],c:1},
{n:26,s:"A",q:"Τα ελατήρια πιέσεως των εμβόλων τι κάνουν;",o:["Ρυθμίζουν την πίεση στους κυλίνδρους.","Εμποδίζουν τα αέρια να περάσουν στο κάρτερ."],c:1},
{n:27,s:"A",q:"Ποιος άξονας κινεί τις βαλβίδες;",o:["Ο εκκεντροφόρος.","Ο στροφαλοφόρος."],c:0},
{n:28,s:"A",q:"Όταν ο κινητήρας του ελκυστήρα βγάζει γαλανό καπνό, τι συμβαίνει;",o:["Καίει ο κινητήρας πολλά λάδια λόγω φθοράς.","Η ποιότητα του λαδιού που βάλαμε δεν είναι καλή."],c:0},
{n:29,s:"A",q:"Όταν ο κινητήρας, για κάποια αιτία, λειτουργεί κρύος, σε θερμοκρασία μικρότερη της κανονικής, ποιες από τις παρακάτω συνέπειες έχουμε;",o:["Η αντλία πετρελαίου δεν δίνει την κανονική ποσότητα καυσίμου.","Δεν αποδίδει την ισχύ του ο κινητήρας."],c:1},
{n:30,s:"A",q:"Η μηχανή ντίζελ του ελκυστήρα δεν τραβάει. Τι μπορεί να συμβαίνει σχετικά με τις βαλβίδες;",o:["Οι βαλβίδες δεν εφαρμόζουν καλά ή δεν είναι ρυθμισμένες.","Οι βαλβίδες είναι πολύ εφαρμοστές."],c:0},
{n:31,s:"A",q:"Πότε μπαίνουν νερά στο κάρτερ;",o:["Όταν έχει ρήγμα η κυλινδροκεφαλή ή έχει καεί η φλάντζα της.","Όταν χαλάσει η αντλία νερού."],c:0},
{n:32,s:"A",q:"Ο κινητήρας δεν τραβάει. Τι από τα παρακάτω μπορεί να συμβαίνει, σχετικά με τα ελατήρια εμβόλων;",o:["Έχουν φθορά τα ελατήρια.","Τα ελατήρια είναι καινούργια."],c:0},
{n:33,s:"A",q:"Πώς ενεργούμε όταν κατεβαίνουμε ένα δρόμο κατηφορικό;",o:["Χρησιμοποιούμε μικρή ταχύτητα, πατώντας στην ανάγκη και ποδόφρενο.","Χρησιμοποιούμε διαρκώς ποδόφρενο.","Βγάζουμε την ταχύτητα και πηγαίνουμε αργά, χρησιμοποιώντας τα φρένα."],c:0},
{n:34,s:"A",q:"Πότε είναι περισσότερο επικίνδυνο να κινούμαστε με σβησμένη τη μηχανή;",o:["Όταν έχουμε μηχανικά φρένα.","Όταν έχουμε υδραυλικά φρένα.","Όταν έχουμε αερόφρενα."],c:2},
{n:35,s:"A",q:"Πώς μπορούμε να περάσουμε ασφαλέστερα ένα ολισθηρό τμήμα του δρόμου;",o:["Εάν αναπτύξουμε μεγάλη ταχύτητα.","Εάν σβήσουμε τη μηχανή και προχωρούμε χωρίς ταχύτητα.","Εάν προχωρούμε με μικρή ταχύτητα και αποφεύγουμε τα φρεναρίσματα."],c:2},
{n:36,s:"A",q:"Κάνουμε ρυθμίσεις στο άροτρο;",o:["Όχι, δεν κάνουμε.","Ρυθμίζουμε το βάθος εκσκαφής, την οριζοντιότητά του και την ευθυγράμμισή του με την κατεύθυνση πορείας του ελκυστήρα."],c:1},
{n:37,s:"A",q:"Ποια από τις παρακάτω είναι η σωστή σειρά μετάδοσης της κίνησης στον ελκυστήρα;",o:["Κινητήρας – συμπλέκτης – κιβώτιο ταχυτήτων – άξονας μετάδοσης της κίνησης – διαφορικό – ημιαξόνια – τροχοί.","Κινητήρας – κιβώτιο ταχυτήτων – άξονας μετάδοσης της κίνησης – συμπλέκτης – διαφορικό – ημιαξόνια – τροχοί."],c:0},
{n:38,s:"A",q:"Σε τι χρησιμεύει ο δείκτης στροφών του κινητήρα στον χειριστή;",o:["Για να ρυθμίζει τις στροφές του κινητήρα στο όργωμα.","Για να ρυθμίζει τις στροφές του κινητήρα, όταν συνδέει τον ελκυστήρα με άλλους μηχανισμούς (αντλία, αλωνιστική κτλ.).","Για να αυξομειώνει αναλόγως τη χορήγηση καυσίμου."],c:1},
{n:39,s:"A",q:"Πώς διατηρούμε την ισοπέδωση του χωραφιού μας;",o:["Όταν κάνουμε όλο συγκλίνουσες αρόσεις.","Όταν κάνουμε όλο αποκλίνουσες αρόσεις.","Όταν οι συγκλίνουσες και αποκλίνουσες αρόσεις εναλλάσσονται."],c:2},
{n:40,s:"A",q:"Από τι εξαρτάται το καλό τρίψιμο του εδάφους στο όργωμα;",o:["Από τη μορφή του φτερού (αναστρεπτήρα) του αρότρου και την ταχύτητα του ελκυστήρα.","Από τη μορφή του ινίου του αρότρου."],c:0},
{n:41,s:"B",q:"Εάν κοπεί το λουρί του ανεμιστήρα ή είναι πολύ χαλαρό, τι θα συμβεί;",o:["Θα ζεσταθεί ο συμπλέκτης.","Θα ζεσταθεί πολύ ο κινητήρας και δεν θα τραβάει."],c:1},
{n:42,s:"B",q:"Ποιος είναι ο σκοπός του αντιπηκτικού στο νερό του ψυγείου;",o:["Για να κυκλοφορεί το νερό καλύτερα.","Για να θερμαίνεται το νερό γρηγορότερα.","Για να μην παγώσει το νερό και σπάσει ο κινητήρας."],c:2},
{n:43,s:"B",q:"Η υπερβολική ποσότητα αλάτων στο ψυγείο μπορεί να προκαλέσει υπερθέρμανση του κινητήρα;",o:["Ναι","Όχι"],c:0},
{n:44,s:"B",q:"Γιατί καθαρίζουμε τις κυψέλες του ψυγείου από τα φύλλα, τα χώματα κτλ.;",o:["Για να κρυώνει ευκολότερα το νερό του ψυγείου.","Για να μη σκουριάζει το ψυγείο."],c:0},
{n:45,s:"B",q:"Ποιο από τα παρακάτω μας δείχνει ότι μπορεί το λουρί του ανεμιστήρα να είναι πολύ χαλαρό ή να έχει κοπεί;",o:["Το μανόμετρο του λαδιού.","Ο θόρυβος της μηχανής.","Το θερμόμετρο."],c:2},
{n:46,s:"B",q:"Ποιες συνέπειες έχει το πάγωμα του νερού στον κινητήρα;",o:["Τη φθορά των εμβόλων.","Το ράγισμα του κινητήρα, λόγω διαστολής του νερού.","Το βούλωμα των αγωγών του νερού και συνεπώς κακή κυκλοφορία του."],c:1},
{n:47,s:"B",q:"Το λουρί του ανεμιστήρα παίζει κανένα ρόλο στην υπερθέρμανση του κινητήρα;",o:["Ναι","Όχι"],c:0},
{n:48,s:"B",q:"Εργαζόμαστε και ο κινητήρας του ελκυστήρα υπερθερμαίνεται. Υποπτευόμαστε ότι το ψυγείο έχει λίγο νερό. Πώς θα ανοίξουμε το καπάκι, για να συμπληρώσουμε;",o:["Θα το ανοίξουμε ελεύθερα.","Θα λασκάρουμε πρώτα την τάπα για να φύγουν οι ατμοί."],c:1},
{n:49,s:"B",q:"Η αντλία νερού χάλασε. Τι θα υπερθερμανθεί;",o:["Το ψυγείο","Η μηχανή"],c:1},
{n:50,s:"B",q:"Πρέπει το λουρί του ανεμιστήρα να ρυθμίζεται πολύ σφιχτό ή πολύ χαλαρό;",o:["Πολύ σφιχτό.","Πολύ χαλαρό.","Ούτε πολύ σφιχτό, ούτε πολύ χαλαρό."],c:2},
{n:51,s:"B",q:"Γιατί το χειμώνα, σε περίπτωση που αφήνουμε τον ελκυστήρα στο ύπαιθρο σε περιοχές που η θερμοκρασία πέφτει κάτω του 0°, πρέπει ή να αδειάσουμε τα νερά ή να βάζουμε αντιπηκτικό;",o:["Διότι ο κινητήρας θα σπάσει.","Διότι δε θα μπορέσουμε, πριν λιώσει ο πάγος το πρωί, να βάλουμε μπροστά τον κινητήρα."],c:0},
{n:52,s:"B",q:"Τα άλατα στο ψυγείο κάνουν κακό. Ποιο νερό έχει τα λιγότερα άλατα;",o:["Της βρύσης.","Το βρόχινο."],c:1},
{n:53,s:"B",q:"Ποιο από τα παρακάτω εξαρτήματα, όταν δεν είναι καλά ρυθμισμένο ή συντηρημένο, μπορεί να προκαλέσει υπερθέρμανση του κινητήρα;",o:["Το λουρί του ανεμιστήρα.","Ο συμπλέκτης."],c:0},
{n:54,s:"B",q:"Κάθε πότε πρέπει να ελέγχουμε τη στάθμη του νερού στο ψυγείο;",o:["Κάθε μέρα.","Κάθε εβδομάδα.","Όταν ζεσταίνεται ο κινητήρας."],c:0},
{n:55,s:"B",q:"Τι κάνει ο ανεμιστήρας (βεντιλατέρ);",o:["Δημιουργεί ρεύμα αέρα για να ψύχεται το νερό του ψυγείου.","Δημιουργεί ρεύμα αέρα για να ψύχεται το λάδι στο κάρτερ."],c:0},
{n:56,s:"B",q:"Το όργανο ελέγχου που λέγεται αμπερόμετρο τι μας δείχνει;",o:["Αν το δυναμό φορτώνει τη μπαταρία.","Αν η μπαταρία είναι φορτισμένη."],c:0},
{n:57,s:"B",q:"Πόσο πρέπει να σκεπάζονται οι πλάκες της μπαταρίας με υγρά;",o:["Περίπου ένα εκατοστό.","Τα υγρά να γεμίζουν τη μπαταρία μέχρι επάνω."],c:0},
{n:58,s:"B",q:"Τι χρειάζεται το ηλεκτρικό ρεύμα στους πετρελαιοκίνητους ελκυστήρες;",o:["Για την παραγωγή σπινθήρα στους θαλάμους καύσης.","Για να κινεί τη μίζα και για το σύστημα φωτισμού."],c:1},
{n:59,s:"B",q:"Όταν οι πόλοι της μπαταρίας δεν είναι καθαροί, αλλά έχουν οξειδώσει κλπ., τι μπορεί να συμβεί;",o:["Δεν μπορούμε να πάρουμε ρεύμα από την μπαταρία.","Το ρεύμα της μπαταρίας τελειώνει γρήγορα."],c:0},
{n:60,s:"B",q:"Ποιος είναι ο ρόλος της μπαταρίας;",o:["Παράγει ρεύμα.","Αποθηκεύει ρεύμα.","Παράγει και αποθηκεύει ρεύμα."],c:1},
{n:61,s:"B",q:"Τι είδους λιπαντικό χρησιμοποιούμε για τους πόλους της μπαταρίας;",o:["Λάδι μηχανής","Βαζελίνη"],c:1},
{n:62,s:"B",q:"Όταν ο ελκυστήρας στρίβει δεξιά, ποιος τροχός τρέχει περισσότερο;",o:["Ο δεξιός","Ο αριστερός"],c:1},
{n:63,s:"B",q:"Πατάμε τη μίζα και ο κινητήρας δε γυρίζει. Τι από τα παρακάτω μπορεί να συμβαίνει;",o:["Φθάνει πολύ ρεύμα στη μίζα.","Δεν φθάνει ρεύμα στη μίζα."],c:1},
{n:64,s:"B",q:"Στο όργωμα, πότε τα λάστιχα δεν πιάνουν καλά και πατινάρουν;",o:["Όταν έχουν κανονικό αέρα.","Όταν έχουν πολύ αέρα."],c:1},
{n:65,s:"B",q:"Όταν κινούμαστε σε παγωμένο έδαφος ή σε δρόμο με αιχμηρές πέτρες, τι είναι προτιμότερο για τα λάστιχα, να τρέχουμε με μικρή ή μεγάλη ταχύτητα;",o:["Να τρέχουμε με μικρή ταχύτητα.","Να τρέχουμε με μεγάλη ταχύτητα."],c:0},
{n:66,s:"B",q:"Όταν τα λάστιχα των τροχών του ελκυστήρα έχουν λιγότερο από τον κανονικό αέρα, κατά τη πορεία πού παρατηρείται φθορά;",o:["Στους αεροθαλάμους (σαμπρέλες).","Στα λινά."],c:1},
{n:67,s:"B",q:"Όταν η πίεση στα λάστιχα είναι μικρότερη από αυτήν που προβλέπει ο κατασκευαστής, μεταξύ των άλλων, έχουμε αφύσικη φθορά στα πέλματα (τακούνια). Ποιο από τα παρακάτω συμβαίνει;",o:["Φθείρονται τα πέλματα στις άκρες.","Φθείρονται τα πέλματα στην μέση."],c:0},
{n:68,s:"B",q:"Στο χωράφι οι τροχοί του ελκυστήρα λασπώθηκαν και πρόκειται να περάσει από ασφαλτοστρωμένο δρόμο. Τι πρέπει να κάνουμε;",o:["Πρέπει να καθαρίσουμε τους τροχούς από τις λάσπες, γιατί είναι πιθανό να προκαλέσουμε ατύχημα σε άλλα οχήματα που θα περάσουν μετά από μας.","Πρέπει να καθαρίσουμε τους τροχούς για λόγους συντηρήσεως."],c:0},
{n:69,s:"B",q:"Βλάπτει να πέφτουν πάνω στα λάστιχα πετρέλαια, ορυκτέλαια και άλλα υγρά;",o:["Όχι","Ναι"],c:1},
{n:70,s:"B",q:"Όταν βάζουμε περισσότερο από τον κανονικό αέρα στα λάστιχα των τροχών, πού έχουμε φθορές;",o:["Στους αεροθαλάμους (σαμπρέλες).","Στη ράχη του πέλματος.","Στα λινά των ελαστικών."],c:1},
{n:71,s:"B",q:"Ο ελκυστήρας δεν πρόκειται να δουλέψει για πολύ χρόνο. Τι θα κάνουμε για να φυλάξουμε τα λάστιχα από τη φθορά;",o:["Θα τακάρουμε τον ελκυστήρα και θα σκεπάσουμε τα λάστιχα.","Θα ξεφουσκώσουμε εντελώς τα λάστιχα."],c:0},
{n:72,s:"B",q:"Ένα λάστιχο τροχού του ελκυστήρα χάνει αέρα. Τι θα κάνουμε πρώτα;",o:["Θα ελέγξουμε πρώτα τη βαλβίδα του.","Θα βγάλουμε πρώτα το λάστιχο και μετά θα βρούμε από πού χάνει αέρα."],c:0},
{n:73,s:"B",q:"Πότε είναι πιο σωστό να γεμίζουμε το ρεζερβουάρ με πετρέλαιο, το βράδυ όταν επιστρέφουμε από το χωράφι ή το πρωί, πριν ξεκινήσουμε για τη δουλειά, και για ποιο λόγο;",o:["Το πρωί, γιατί δεν έχει σημασία πότε θα βάλουμε το πετρέλαιο.","Το βράδυ, γιατί έτσι όλη τη νύχτα οι σκόνες και το νερό που υπάρχει στο πετρέλαιο κατασταλάζουν στο ποτηράκι και, επιπλέον, δεν δημιουργούνται υδρατμοί στο ρεζερβουάρ."],c:1},
{n:74,s:"B",q:"Κάναμε συντήρηση του φίλτρου πετρελαίου, το ξαναβάλαμε στη θέση του και ο κινητήρας δεν παίρνει εμπρός. Γιατί;",o:["Πήρε αέρα το κύκλωμα κυκλοφορίας του πετρελαίου και θέλει εξαέρωση.","Απορυθμίστηκε η αντλία πετρελαίου."],c:0},
{n:75,s:"B",q:"Ποιος είναι ο σκοπός της αντλίας πετρελαίου;",o:["Να στέλνει το πετρέλαιο στο χώρο καύσης την ορισμένη στιγμή, σε ορισμένη ποσότητα και πίεση.","Να καθαρίζει το πετρέλαιο."],c:0},
{n:76,s:"B",q:"Το ρεζερβουάρ (δοχείο καυσίμου) πότε πρέπει να γεμίζεται με πετρέλαιο, το βράδυ μετά την εργασία, όταν ο ελκυστήρας είναι ζεστός, ή το πρωί που είναι κρύος;",o:["Το πρωί που ο ελκυστήρας είναι κρύος.","Το βράδυ μετά τη δουλειά.","Δεν έχει σημασία."],c:1},
{n:77,s:"B",q:"Σε τι χρησιμεύει στο χειριστή το ωρόμετρο του ελκυστήρα;",o:["Για να γνωρίζει τη σωστή ώρα.","Για να εκτελεί έγκαιρα τη συντήρηση του ελκυστήρα.","Για να γνωρίζει τα χιλιόμετρα που έχει διανύσει στην πορεία."],c:1},
{n:78,s:"B",q:"Πότε είναι καλύτερα να γίνεται το γρασάρισμα; Το βράδυ, όταν επιστρέφουμε από το χωράφι, ή το πρωί, και για ποιο λόγο;",o:["Το πρωί που είμαστε ξεκούραστοι.","Το βράδυ, γιατί τα σίδερα είναι ζεστά και το γράσο μαλακώνει και εισχωρεί πιο εύκολα."],c:1},
{n:79,s:"B",q:"Κάθε πόσες ώρες εργασίας περίπου πρέπει να αλλάζουμε τις βαλβολίνες του ελκυστήρα, μετά το ροντάρισμά του;",o:["Όπως ορίζει ο κατασκευαστής στο βιβλίο συντηρήσεως του μηχανήματος.","Κάθε 100–150 ώρες εργασίας.","Κάθε χρόνο."],c:0},
{n:80,s:"B",q:"Όταν εκτελούμε αλλαγή του λαδιού ή της βαλβολίνης, πρέπει ο κινητήρας να είναι ζεστός ή κρύος;",o:["Κρύος","Ζεστός"],c:1},
{n:81,s:"B",q:"Πότε πρέπει να γίνεται η συμπλήρωση των λαδιών του κινητήρα, το πρωί που ο κινητήρας είναι κρύος ή το βράδυ που είναι ζεστός;",o:["Το βράδυ που είναι ζεστός.","Το πρωί που είναι κρύος."],c:1},
{n:82,s:"B",q:"Τι δείχνει το μανόμετρο του λαδιού;",o:["Τη θερμοκρασία του λαδιού.","Την πίεση του λαδιού.","Την ποσότητα του λαδιού."],c:1},
{n:83,s:"B",q:"Πού πρέπει να βρίσκεται η στάθμη του λαδιού στον κινητήρα;",o:["Πάνω από την επάνω γραμμή του δείκτη (βέργας).","Μεταξύ των δύο γραμμών του δείκτη (βέργας).","Κάτω από την κάτω γραμμή του δείκτη (βέργας)."],c:1},
{n:84,s:"B",q:"Τα λάδια που χρησιμοποιούμε για τους πετρελαιοκινητήρες είναι ίδια με εκείνα των βενζινοκινητήρων;",o:["Όχι","Ναι"],c:0},
{n:85,s:"B",q:"Κάθε πότε πρέπει να γίνεται η αλλαγή των λαδιών του κινητήρα;",o:["Όπως ορίζει ο κατασκευαστής στο βιβλίο συντηρήσεως του μηχανήματος.","Κάθε 200 ώρες εργασίας.","Δύο φορές το χρόνο."],c:0},
{n:86,s:"B",q:"Κάθε πότε πρέπει να ελέγχουμε τη στάθμη του λαδιού του κινητήρα;",o:["Κάθε εβδομάδα.","Κάθε 50 ώρες εργασίας.","Κάθε μέρα."],c:2},
{n:87,s:"B",q:"Σε τι χρησιμεύει το φίλτρο του αέρα;",o:["Εμποδίζει τη σκόνη να μπει στο ρεζερβουάρ.","Καθαρίζει τον αέρα του βεντιλατέρ.","Προστατεύει τον κινητήρα από τις σκόνες του αέρα, που μπαίνουν σ' αυτόν με την αναπνοή του."],c:2},
{n:88,s:"B",q:"Πότε πρέπει να καθαρίζουμε συχνότερα το φίλτρο του αέρα, το χειμώνα ή το καλοκαίρι;",o:["Το χειμώνα.","Το καλοκαίρι."],c:1},

{n:90,s:"B",q:"Από τι εξαρτάται η συχνότητα της συντήρησης του φίλτρου του αέρα;",o:["Από τις σκόνες που υπάρχουν στο περιβάλλον εργασίας.","Από την εποχή του έτους."],c:0},
{n:91,s:"B",q:"Όταν το φίλτρο του αέρα δεν συντηρείται σωστά, ποιο όργανο του ελκυστήρα φθείρεται;",o:["Η αντλία πετρελαίου.","Ο κινητήρας."],c:1},
{n:92,s:"B",q:"Το λάδι που χρησιμοποιούμε για το φίλτρο του αέρα είναι ίδιο με το λάδι που βάζουμε στο κάρτερ του κινητήρα;",o:["Ναι","Όχι"],c:0},
{n:93,s:"B",q:"Όταν στο δοχείο του φίλτρου αέρα βάλουμε λιγότερο λάδι από το κανονικό, τι θα συμβεί;",o:["Ο κινητήρας θα καίει περισσότερο πετρέλαιο.","Ο αέρας δεν θα φιλτράρεται (καθαρίζεται) καλά."],c:1},
{n:94,s:"B",q:"Πότε πρέπει να γίνεται πιο συχνά η συντήρηση του φίλτρου του αέρα;",o:["Όταν οι καιρικές συνθήκες είναι κακές.","Όταν στο περιβάλλον εργασίας υπάρχουν πολλές σκόνες."],c:1},
{n:95,s:"B",q:"Πριν βάλουμε σε λειτουργία (μπροστά) τον κινητήρα, σε ποια θέση πρέπει να βρίσκεται ο μοχλός ταχυτήτων;",o:["Στην πρώτη ταχύτητα.","Στο νεκρό σημείο."],c:1},
{n:96,s:"B",q:"Όταν ο ελκυστήρας κινείται σε δρόμο, πρέπει τα πεντάλ των φρένων να είναι συνδεδεμένα;",o:["Ναι","Όχι"],c:0},

{n:98,s:"B",q:"Εάν κατά τη διάρκεια της εργασίας διαπιστώσουμε ότι η πίεση του λαδιού του κινητήρα είναι χαμηλή, τι πρέπει να κάνουμε;",o:["Να σβήσουμε τον κινητήρα και να ακινητοποιήσουμε τον ελκυστήρα, μέχρι να βρεθεί η αιτία.","Να συνεχίσουμε την εργασία μας.","Να αναπτύξουμε μεγαλύτερη ταχύτητα."],c:0},
{n:99,s:"B",q:"Πλησιάζουμε σε αφύλακτη σιδηροδρομική διάβαση. Τι θα κάνουμε;",o:["Θα σταματήσουμε τελείως, θα βεβαιωθούμε ότι δεν έρχεται συρμός και θα περάσουμε με πρώτη ταχύτητα.","Θα ελαττώσουμε ταχύτητα και θα περάσουμε γρήγορα."],c:0},
{n:100,s:"B",q:"Μερικοί χειριστές, κατά τη διάρκεια της εργασίας, έχουν συνέχεια το πόδι τους επάνω στο πεντάλ του συμπλέκτη (αμπραγιάζ). Τι θα συμβεί;",o:["Θα φθείρεται ο συμπλέκτης (φερμουίτ, ρουλεμάν).","Θα φθείρεται το πεντάλ.","Δεν θα συμβεί τίποτα."],c:0},
{n:101,s:"B",q:"Εργαζόμαστε στο χωράφι και αντιλαμβανόμαστε ότι ο κινητήρας υπερθερμάνθηκε. Τι πρέπει να κάνουμε;",o:["Σβήνουμε αμέσως τον κινητήρα.","Συνεχίζουμε την εργασία.","Σταματάμε την εργασία και αφήνουμε τον κινητήρα να δουλέψει στο ρελαντί, μέχρι να πέσει η θερμοκρασία, και ερευνούμε για την αιτία."],c:2},
{n:102,s:"B",q:"Πώς επιτυγχάνεται οικονομία καυσίμου κατά την εργασία;",o:["Όταν χρησιμοποιούμε την κατάλληλη ταχύτητα για κάθε εργασία.","Όταν εργαζόμαστε συνέχεια με μεγάλη ταχύτητα.","Όταν εργαζόμαστε συνέχεια με μικρή ταχύτητα."],c:0},
{n:103,s:"B",q:"Επιτρέπεται η μεταφορά συνεπιβατών με τον ελκυστήρα;",o:["Μόνο εάν υπάρχει ειδική, κατάλληλη κατασκευή καθίσματος.","Ναι, στα φτερά του ελκυστήρα.","Δεν επιτρέπεται ποτέ."],c:0},
{n:104,s:"B",q:"Τι προστατεύει το χειριστή σε περίπτωση ανατροπής του ελκυστήρα;",o:["Η καμπίνα ή το πλαίσιο (αψίδα) ασφαλείας.","Η ζώνη ασφαλείας μόνο.","Το βάρος του ελκυστήρα."],c:0},
{n:105,s:"B",q:"Πότε τα φρένα του ελκυστήρα είναι καλά ρυθμισμένα;",o:["Όταν φρενάρουν, αφού το πεντάλ διανύσει περίπου τη μισή διαδρομή του.","Όταν φρενάρουν αμέσως, μόλις αγγίξουμε το πεντάλ.","Όταν φρενάρουν στο τέλος της διαδρομής του πεντάλ."],c:0},
{n:106,s:"B",q:"Στις ανατροπές των ελκυστήρων, που είναι το συνηθέστερο και σοβαρότερο αγροτικό ατύχημα, ποιος κατά κανόνα φταίει;",o:["Ο ελκυστήρας.","Ο οδηγός (χειριστής).","Το έδαφος."],c:1},
{n:107,s:"B",q:"Αφήνουμε τον ελκυστήρα στη ρεμίζα (στο υπόστεγο). Τι πρέπει να κάνουμε για να μην κυλήσει;",o:["Αφήνουμε τον κινητήρα αναμμένο.","Ασφαλίζουμε τα φρένα και βάζουμε ταχύτητα (πρώτη ή όπισθεν).","Αφήνουμε το μοχλό ταχυτήτων στο νεκρό σημείο."],c:1},
{n:108,s:"B",q:"Τι μπορεί να προκαλέσουν τα μπουλόνια και τα παξιμάδια που έχουν λασκάρει;",o:["Δεν προκαλούν τίποτα.","Επιζήμιες φθορές στο μηχάνημα και ατυχήματα.","Μόνο θόρυβο."],c:1},
{n:109,s:"B",q:"Τι πρέπει να ελέγχουμε στο υδραυλικό σύστημα του ελκυστήρα;",o:["Τη στάθμη του λαδιού του συστήματος.","Μόνο τους σωλήνες.","Δεν χρειάζεται έλεγχο."],c:0},

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

  const stats=seen>0
    ? '<div class="stats enter">'+
      '<div class="stat"><b>'+seen+'</b><span>έχεις δει</span></div>'+
      '<div class="stat"><b>'+acc+'%</b><span>σωστές</span></div>'+
      '<div class="stat'+(wk>0?' warn':'')+'"><b>'+wk+'</b><span>αδύναμες</span></div>'+
      '</div><button class="reset" id="rst">Μηδενισμός στατιστικών</button>'
    : '';
  app().innerHTML=
   '<div class="hero enter">'+I_TRACTOR+
   '<div class="kicker">Χειριστής γεωργικών μηχανημάτων</div>'+
   '<h1>Προετοιμασία εξετάσεων</h1>'+
   '<p class="sub">110 ερωτήσεις · Ενότητα Α (1–40) · Ενότητα Β (41–110)</p>'+
   '<div class="by">Δημιουργός: Δρ. Κουκουβίνος Γεώργιος</div>'+
   '</div>'+
   '<div class="menu enter">'+
   '<button class="card" onclick="practiceSetup()"><span class="icon">'+I_BOOK+'</span>'+
   '<span class="card-body"><span class="card-title">Εξάσκηση</span>'+
   '<span class="card-sub">Άμεση διόρθωση σε κάθε ερώτηση, με τη σειρά ή τυχαία.</span></span>'+
   '<span class="chev">›</span></button>'+
   '<button class="card" onclick="examSetup()"><span class="icon">'+I_TIMER+'</span>'+
   '<span class="card-body"><span class="card-title">Προσομοίωση εξέτασης</span>'+
   '<span class="card-sub">Τυχαίες ερωτήσεις, χρονόμετρο και βαθμολογία στο τέλος.</span></span>'+
   '<span class="chev">›</span></button>'+
   '</div>'+stats+
   '<div class="kbd-hint">Στον υπολογιστή: <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> απάντηση · <kbd>←</kbd><kbd>→</kbd> πλοήγηση</div>';
  const el=document.getElementById("rst");
  if(el)el.onclick=()=>{
    if(!el.dataset.arm){el.dataset.arm="1";el.textContent="Σίγουρα; Πάτησε ξανά για οριστικό μηδενισμό";}
    else{ST={h:{}};saveST();home();}
  };
}

function bindSeg(id,cb){
  document.querySelectorAll('#'+id+' button').forEach(b=>{
    b.onclick=()=>{document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('on'));b.classList.add('on');cb(b.dataset.v);};
  });
}

function practiceSetup(){
  stopTimer();S=null;
  let set="all",ord="seq";
  const wk=weakList().length;
  app().innerHTML=
   '<div class="topbar"><button class="link" onclick="home()">‹ Αρχική</button><span class="topttl">Εξάσκηση</span><span></span></div>'+
   '<div class="setup enter">'+
   '<div><div class="lbl">Ερωτήσεις</div>'+
   '<div class="seg" id="segSet"><button data-v="all" class="on">Όλες (1–110)</button>'+
   '<button data-v="A">Ενότητα Α (1–40)</button>'+
   '<button data-v="B">Ενότητα Β (41–110)</button>'+
   '<button data-v="weak"'+(wk?'':' disabled')+'>Αδύναμες ('+wk+')</button></div>'+
   (wk?'':'<div class="hint">Οι αδύναμες γεμίζουν αυτόματα από τα λάθη σου και αδειάζουν όταν απαντήσεις μια ερώτηση σωστά δύο συνεχόμενες φορές.</div>')+'</div>'+
   '<div><div class="lbl">Σειρά</div>'+
   '<div class="seg row" id="segOrd"><button data-v="seq" class="on">Με τη σειρά</button><button data-v="rnd">Τυχαία</button></div></div>'+
   '<button class="primary" id="goP">Έναρξη</button>'+
   '</div>';
  bindSeg("segSet",v=>set=v);
  bindSeg("segOrd",v=>ord=v);
  document.getElementById("goP").onclick=()=>startPractice(set,ord);
}

function startPractice(set,ord,customList){
  let pool=customList?customList.slice()
    :set==="weak"?weakList()
    :QUESTIONS.filter(q=>set==="all"||q.s===set);
  if(!pool.length){home();return;}
  if(ord==="rnd")pool=shuffle(pool.slice());
  S={mode:"practice",pool:pool,i:0,ans:{},t:0};
  renderQ(true);
}

function examSetup(){
  stopTimer();S=null;
  let lic="A",cnt="20";
  app().innerHTML=
   '<div class="topbar"><button class="link" onclick="home()">‹ Αρχική</button><span class="topttl">Προσομοίωση</span><span></span></div>'+
   '<div class="setup enter">'+
   '<div><div class="lbl">Πτυχίο</div>'+
   '<div class="seg" id="segLic"><button data-v="A" class="on">Τύπου Α (όλη η ύλη)</button><button data-v="B">Τύπου Β (ερ. 41–110)</button></div></div>'+
   '<div><div class="lbl">Αριθμός ερωτήσεων</div>'+
   '<div class="seg row" id="segCnt"><button data-v="10">10</button><button data-v="20" class="on">20</button><button data-v="30">30</button><button data-v="real">Εξέταση</button></div>'+
   '<div class="hint">«Εξέταση»: όπως στις πραγματικές συνθήκες — 15 ερωτήσεις για πτυχίο Α, 10 για πτυχίο Β. Επιτυχία με έως 2 λάθη.</div></div>'+
   '<button class="primary" id="goE">Έναρξη τεστ</button>'+
   '</div>';
  bindSeg("segLic",v=>lic=v);
  bindSeg("segCnt",v=>cnt=v);
  document.getElementById("goE").onclick=()=>startExam(lic,cnt);
}

function startExam(lic,cnt){
  const base=lic==="B"?QUESTIONS.filter(q=>q.s==="B"):QUESTIONS.slice();
  const real=cnt==="real";
  const n=real?(lic==="B"?10:15):parseInt(cnt,10);
  const pool=shuffle(base.slice()).slice(0,Math.min(n,base.length));
  S={mode:"exam",real:real,pool:pool,i:0,ans:{},t:0};
  timerId=setInterval(()=>{S.t++;const e=document.getElementById("tmr");if(e)e.textContent=fmt(S.t);},1000);
  renderQ(true);
}

function renderQ(anim){
  const q=S.pool[S.i],N=S.pool.length;
  const answered=Object.keys(S.ans).length;
  let c=0,w=0;
  S.pool.forEach(x=>{if(S.ans[x.n]!==undefined){if(S.ans[x.n]===x.c)c++;else w++;}});
  const right=S.mode==="exam"
    ? '<span class="tmr" id="tmr">'+fmt(S.t)+'</span>'
    : '<span class="score">'+c+' σωστές · '+w+' λάθη</span>';
  let opts='';
  const given=S.ans[q.n];
  q.o.forEach((o,i)=>{
    let cls="opt",badge=L[i];
    if(given!==undefined){
      cls+=" locked";
      if(S.mode==="practice"){
        if(i===q.c){cls+=" ok";badge="✓";}
        else if(i===given){cls+=" bad";badge="✕";}
      }else if(i===given){cls+=" sel";}
    }
    opts+='<div class="'+cls+'" onclick="answer('+i+')"><span class="ltr">'+badge+'</span><span>'+esc(o)+'</span></div>';
  });
  let fb='';
  if(S.mode==="practice"&&given!==undefined){
    fb=given===q.c
      ? '<div class="fb ok-t">Σωστά.</div>'
      : '<div class="fb bad-t">Λάθος. Σωστή απάντηση: '+L[q.c]+' — '+esc(q.o[q.c])+'</div>';
  }
  app().innerHTML=
   '<div class="topbar"><button class="link" onclick="home()">‹ Αρχική</button><span class="topttl">'+(S.i+1)+' / '+N+'</span>'+right+'</div>'+
   '<div class="prog"><div class="prog-in" style="width:'+(answered/N*100)+'%"></div></div>'+
   '<div class="q'+(anim?' enter':'')+'">'+
   '<div class="qmeta"><span class="pill">Ερώτηση '+q.n+'</span><span class="pill soft">Ενότητα '+q.s+'</span></div>'+
   '<div class="qtext">'+esc(q.q)+'</div>'+
   '<div class="opts">'+opts+'</div>'+fb+
   '</div>'+
   '<div class="nav">'+
   '<button class="ghost" onclick="move(-1)"'+(S.i===0?' disabled':'')+'>‹ Προηγούμενη</button>'+
   (S.i<N-1
     ? '<button class="primary" onclick="move(1)">Επόμενη ›</button>'
     : '<button class="primary" onclick="finish()">Ολοκλήρωση</button>')+
   '</div>';
}

function answer(i){
  const q=S.pool[S.i];
  if(i>=q.o.length)return;
  if(S.mode==="practice"){
    if(S.ans[q.n]!==undefined)return;
    S.ans[q.n]=i;
    record(q.n,i===q.c);
  }else{
    S.ans[q.n]=i;
  }
  renderQ(false);
}

function move(d){
  S.i=Math.min(S.pool.length-1,Math.max(0,S.i+d));
  renderQ(true);
}

function finish(){
  stopTimer();
  const N=S.pool.length;
  let c=0;const wrong=[];
  S.pool.forEach(q=>{
    const a=S.ans[q.n];
    if(a===q.c)c++;else wrong.push({q:q,a:a});
    if(S.mode==="exam"&&a!==undefined)record(q.n,a===q.c);
  });
  const pct=Math.round(c/N*100);
  const un=S.pool.filter(q=>S.ans[q.n]===undefined).length;
  window._wrong=wrong.map(x=>x.q);
  let verdict='';
  if(S.mode==="exam"&&S.real){
    const pass=wrong.length<=2;
    verdict='<div><span class="verdict '+(pass?'pass':'fail')+'">'+(pass?'Επιτυχία':'Αποτυχία')+'</span></div>'+
            '<div class="res-note">Όριο επιτυχίας: έως 2 λάθη'+(un>0?' — οι αναπάντητες μετρούν ως λάθη':'')+'.</div>';
  }
  let wl='';
  wrong.forEach(x=>{
    wl+='<div class="witem"><div class="wq">'+x.q.n+'. '+esc(x.q.q)+'</div>'+
        (x.a!==undefined?'<div class="wa bad-t">Απαντήσατε: '+L[x.a]+' — '+esc(x.q.o[x.a])+'</div>':'<div class="wa bad-t">Δεν απαντήθηκε</div>')+
        '<div class="wa ok-t">Σωστό: '+L[x.q.c]+' — '+esc(x.q.o[x.q.c])+'</div></div>';
  });
  const mode=S.mode;
  app().innerHTML=
   '<div class="topbar"><button class="link" onclick="home()">‹ Αρχική</button><span class="topttl">Αποτελέσματα</span><span></span></div>'+
   '<div class="res enter">'+
   '<div class="ring" style="--p:'+pct+'"><div class="ring-in"><div class="res-score">'+c+'/'+N+'</div><div class="res-pct">'+pct+'%</div></div></div>'+
   (mode==="exam"?'<div class="res-time">Χρόνος: '+fmt(S.t)+'</div>':'')+
   verdict+
   (!S.real&&un>0?'<div class="res-note">Αναπάντητες: '+un+'</div>':'')+
   (wrong.length===0?'<div class="res-note">Όλες σωστές. Μπράβο!</div>':'')+
   '</div>'+
   (wrong.length
     ? '<button class="primary retry" onclick="retryWrong()">Εξάσκηση στα λάθη ('+wrong.length+')</button><div class="wrongs">'+wl+'</div>'
     : '')+
   '<div class="nav">'+
   (mode==="exam"?'<button class="ghost" onclick="examSetup()">Νέο τεστ</button>':'')+
   '<button class="ghost" onclick="home()">Αρχική</button>'+
   '</div>';
}

function retryWrong(){
  if(window._wrong&&window._wrong.length)startPractice(null,"seq",window._wrong);
}

document.addEventListener("keydown",e=>{
  if(!S||!document.querySelector(".opts"))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="1")answer(0);
  else if(e.key==="2")answer(1);
  else if(e.key==="3")answer(2);
  else if(e.key==="ArrowLeft")move(-1);
  else if(e.key==="ArrowRight")move(1);
  else if(e.key==="Enter"&&S.i===S.pool.length-1)finish();
});

home();
</script>
